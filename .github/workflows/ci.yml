name: Test
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run check:hash
      - run: npm audit --audit-level=high
      - run: mkdir -p out/vanillawarp && javac -d out/vanillawarp src/com/transfer/network/WebRelayServer.java src/com/transfer/gui/P2PApplicationGUI.java
      - run: npm test
        env:
          VANILLAWARP_TEST_CLASSPATH: out/vanillawarp
      - run: npx playwright install --with-deps chromium firefox
      - name: Browser-to-browser WebRTC tests
        run: |
          set -e
          # Fresh server per group: the public server intentionally rate-limits room creation.
          for engine in chromium firefox; do
            for pattern in 'real WebRTC|existing file|ask policy|verification mismatch|file download fallback|unsupported browser' 'responsive home|Pages discovers|successful transfer|dropped folder|either participant|failed folder|bounded window|pipelined file starts|connection diagnostics|large multi-window|stalled receiver|CSP blocks' 'tampered ciphertext|replayed chunk|tampered file path|receiver bounds|malicious traversal' 'optional saved-file|saved-file checksum|recovery verifies|recovery asks|interrupted transfer retries|cancelling during recovery|default fast path' 'UX policy|UX accessibility|UX connection|UX progress|frontend theme|frontend splash|frontend dark'; do
              java -cp out/vanillawarp WebRelayServer > /tmp/vanillawarp.log 2>&1 &
              pid=$!
              trap 'kill "$pid" 2>/dev/null || true' EXIT
              for i in {1..50}; do curl -fsS http://127.0.0.1:8080/ >/dev/null && break || sleep .2; done
              VANILLAWARP_BROWSER_ENGINE="$engine" node --test --test-name-pattern="$pattern" tests/browser.test.cjs
              kill "$pid"
              wait "$pid" || true
              trap - EXIT
            done
          done
        env:
          VANILLAWARP_BROWSER_URL: http://127.0.0.1:8080/
